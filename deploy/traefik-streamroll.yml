# Traefik dynamic route for LODGEFLIX (card #1629) — matches the estate's route-*.yml shape.
# CUTOVER STEP: copy to lodge-traefik CT203 config/route-streamroll.yml AT CUTOVER, in a
# monorepo worktree (stacks/traefik/config is a filetree deploy target). Gated with the DNS
# record — both are Hannibal's call. Target = lodge-bad-boy:3939 (published container port).
http:
  routers:
    streamroll:
      rule: Host(`streamroll.thelodge.network`)
      entryPoints:
      - websecure
      service: streamroll
      tls: null
  services:
    streamroll:
      loadBalancer:
        servers:
        - url: http://10.0.101.91:3939
