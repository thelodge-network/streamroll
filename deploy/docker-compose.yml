services:
  streamroll:
    # Local build from this fork (card #1629). Build with:
    #   docker build -t lodge/streamroll:0.1.0 ..
    image: lodge/streamroll:0.1.0
    container_name: streamroll
    restart: unless-stopped
    networks:
      lodge-macvlan101:
        ipv4_address: 10.0.101.119
    env_file:
      - .env
    environment:
      - PREROLL_DIR=/media/Pre-Rolls
      - STING_PATH=/media/Pre-Rolls/netflix.wav
    volumes:
      # Media share (Unraid 'media'): finished pre-rolls land in /media/Pre-Rolls,
      # netflix.wav referenced in place. Host /mnt/media == 10.0.101.3:/mnt/user/media.
      - /mnt/media:/media
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

networks:
  lodge-macvlan101:
    external: true
